spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:lb://employee-service}
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/?(?<segment>.*), /api/auth/$\{segment}
        - id: employee-service
          uri: ${EMPLOYEE_SERVICE_URI:lb://employee-service}
          predicates:
            - Path=/employees/**
          filters:
            - RewritePath=/employees/?(?<segment>.*), /api/employees/$\{segment}
        - id: client-service
          uri: ${CLIENT_SERVICE_URI:lb://client-service}
          predicates:
            - Path=/clients/**
          filters:
            - RewritePath=/clients/?(?<segment>.*), /api/clients/$\{segment}
        - id: project-service
          uri: ${PROJECT_SERVICE_URI:lb://project-service}
          predicates:
            - Path=/projects/**
          filters:
            - RewritePath=/projects/?(?<segment>.*), /api/projects/$\{segment}

server:
  port: ${SERVER_PORT:8085}

security:
  jwt:
    secret: ${JWT_SECRET:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.enterprise.gateway: INFO
